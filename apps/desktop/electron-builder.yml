appId: com.pseudico.localworkos
productName: Local Work OS
copyright: Copyright 2026 Pseudico
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: dist-packaged
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"
  - "!**/*.tsbuildinfo"
  - "!**/.tsbuildinfo{,/**/*}"

extraMetadata:
  main: dist/main/index.js

asar: true
asarUnpack:
  - "**/*.node"

npmRebuild: true
buildDependenciesFromSource: true
publish: null

win:
  signAndEditExecutable: false
  target:
    - target: dir
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dir

linux:
  target:
    - target: dir
